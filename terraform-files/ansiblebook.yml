- name: Configure Docker on EC2 Instances
  hosts: all
  become: true
  connection: ssh

  tasks:

    - name: Update system packages
      yum:
        name: "*"
        state: latest

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Install pip
      yum:
        name: python3-pip
        state: present

    - name: Install Docker Python module
      pip:
        name: docker

    - name: Pull Zomato Docker image
      docker_image:
        name: akankshatech/zomatoapp
        tag: latest
        source: pull

    - name: Deploy Zomato Docker Container
      docker_container:
        name: zomato
        image: akankshatech/zomatoapp:latest
        state: started
        restart_policy: always
        published_ports:
          - "3000:3000"
